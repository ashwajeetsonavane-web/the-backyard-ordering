<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#005b45"><title>THE BACKYARD — Order Direct</title><style>
:root{--green:#005b45;--green2:#08785f;--red:#b6202d;--cream:#f8f5ea;--ink:#123f35;--line:#d9ddd6;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f7f3;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding-bottom:100px}.hero{background:var(--cream);padding:18px 16px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid #d1b44a}.brand h1{margin:0;font-size:21px;letter-spacing:2px;color:var(--green)}.brand p{margin:3px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#66756f}.hero-row{display:flex;justify-content:space-between;align-items:end;margin-top:16px}.hero-row h2{font-size:27px;margin:0;color:var(--green)}.hero-row span{font-size:11px;color:#68766f}.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:93px;z-index:9}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid #cfd6d1;border-radius:999px;padding:8px 12px;background:#fff;color:var(--green);font-weight:700;font-size:12px}.cat.active{background:var(--green);color:#fff;border-color:var(--green)}main{padding:4px 12px}.section{scroll-margin-top:145px}.section h3{font-size:17px;margin:22px 4px 10px;color:var(--green);letter-spacing:.5px}.card{background:#fff;border:1px solid #e3e6e1;border-radius:15px;padding:14px 13px;margin:8px 0;box-shadow:0 2px 8px #00000008}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:15px;line-height:1.2}.price{font-weight:900;color:var(--red);font-size:16px;white-space:nowrap}.desc{font-size:11px;line-height:1.45;color:#65736e;margin:6px 0 11px;max-width:90%}.veg{display:inline-block;width:10px;height:10px;border:2px solid #0b8a4b;position:relative;margin-left:5px;vertical-align:1px}.veg:after{content:"";position:absolute;inset:2px;background:#0b8a4b}.nonveg{border-color:#d92735}.nonveg:after{background:#d92735}.add{width:100%;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:10px;padding:10px;font-weight:800;font-size:13px}.add:active{transform:scale(.99);background:#eef7f3}.cart{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(680px,calc(100% - 24px));background:var(--green);color:#fff;border:0;border-radius:15px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 25px #0004;z-index:30;font-weight:800}.cart small{opacity:.8;font-weight:600}.empty{padding:40px;text-align:center;color:#71807a}
/* drawer */.shade{position:fixed;inset:0;background:#0007;z-index:40;display:none}.shade.open{display:block}.drawer{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:88vh;background:#fff;border-radius:22px 22px 0 0;transform:translateY(100%);transition:.25s;overflow:auto}.shade.open .drawer{transform:translateY(0)}.drawer-inner{max-width:720px;margin:auto;padding:18px 16px 28px}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;color:var(--green)}.close{border:0;background:#eef1ef;border-radius:50%;width:36px;height:36px;font-size:20px}.cartline{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid #cfd6d1;background:#fff;border-radius:8px;width:30px;height:30px}.form{margin-top:16px}.form label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}.form input,.form textarea{width:100%;border:1px solid #cbd4cf;border-radius:11px;padding:12px;font:inherit}.form textarea{min-height:75px;resize:vertical}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pay label{border:1px solid #cbd4cf;border-radius:11px;padding:12px;margin:0;font-weight:700}.place{margin-top:15px;width:100%;border:0;border-radius:12px;padding:14px;background:var(--red);color:#fff;font-weight:900;font-size:15px}.success{display:none;text-align:center;padding:30px 10px}.success.show{display:block}.success .tick{font-size:48px}.track{display:inline-block;margin-top:12px;background:var(--green);color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:800}@media(min-width:700px){.card{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .card{margin:0}.hero{position:relative}.cats{position:sticky;top:0}}
</style></head><body><div class="wrap"><header class="hero"><div class="brand"><img src="assets/logo.jpeg" alt="The Backyard logo"><div><h1>THE BACKYARD</h1><p>BURGER & BREW</p></div></div><div class="hero-row"><h2>Order directly.</h2><span>Freshly prepared · ~20 min</span></div></header><nav id="cats" class="cats"></nav><main id="menu"></main><button class="cart" id="cartBtn"><span>🛒 <b id="cartCount">0</b> items</span><span>₹<b id="cartTotal">0</b> · VIEW CART</span></button></div><div id="shade" class="shade"><section class="drawer"><div class="drawer-inner"><div class="drawer-head"><h2>Your Order</h2><button class="close" id="close">×</button></div><div id="cartLines"></div><div id="checkout"><div class="form"><label>Name *</label><input id="name" autocomplete="name" placeholder="Your name"><label>Mobile Number *</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><label>Delivery / Pickup Location *</label><div style="display:flex;gap:8px"><input id="location" placeholder="Address or pickup note" style="flex:1"><button id="locBtn" type="button" style="border:0;border-radius:11px;background:var(--green);color:#fff;padding:0 12px">📍</button></div><label>Payment</label><div class="pay"><label><input type="radio" name="payment" value="UPI"> UPI</label><label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label></div><label>Order note</label><textarea id="note" placeholder="Less spicy, no onion, etc."></textarea><button class="place" id="place">PLACE ORDER</button></div></div><div id="success" class="success"><div class="tick">✓</div><h2>Order received</h2><p id="successText"></p><a id="track" class="track" href="#">TRACK ORDER</a></div></div></section></div><script>
const menuUrl='menu.json';let menu=[],cart=[];const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('en-IN').format(n);function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){menu=await fetch(menuUrl).then(r=>r.json());renderCats();renderMenu();updateCart()}function renderCats(){$('#cats').innerHTML=menu.map((c,i)=>`<button class="cat ${i===0?'active':''}" data-target="${esc(c.category)}">${esc(c.category)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>document.getElementById('s-'+b.dataset.target).scrollIntoView({behavior:'smooth'}))}function renderMenu(){$('#menu').innerHTML=menu.map(c=>`<section class="section" id="s-${esc(c.category)}"><h3>${esc(c.category)}</h3><div class="grid">${c.items.map((x,idx)=>`<article class="card"><div class="top"><div class="name">${esc(x.name)} <span class="veg ${x.veg?'':'nonveg'}"></span></div><div class="price">₹${x.price}</div></div>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}<button class="add" data-cat="${esc(c.category)}" data-name="${esc(x.name)}">ADD +</button></article>`).join('')}</div></section>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.cat,b.dataset.name))}function find(name){for(const c of menu){const x=c.items.find(i=>i.name===name);if(x)return x}}function add(cat,name){const x=find(name);const q=cart.find(i=>i.name===name);if(q)q.qty++;else cart.push({name,price:x.price,qty:1,category:cat});updateCart()}function updateCart(){const count=cart.reduce((s,i)=>s+i.qty,0),total=cart.reduce((s,i)=>s+i.qty*i.price,0);$('#cartCount').textContent=count;$('#cartTotal').textContent=money(total);renderLines()}function renderLines(){if(!cart.length){$('#cartLines').innerHTML='<div class="empty">Your cart is empty.<br>Add something delicious first.</div>';return}$('#cartLines').innerHTML=cart.map((i,n)=>`<div class="cartline"><div><b>${esc(i.name)}</b><div style="color:#6b7772;font-size:12px">₹${i.price} × ${i.qty}</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button><b>${i.qty}</b><button onclick="changeQty(${n},1)">+</button></div></div>`).join('')}window.changeQty=(n,d)=>{cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);updateCart()};$('#cartBtn').onclick=()=>$('#shade').classList.add('open');$('#close').onclick=()=>$('#shade').classList.remove('open');$('#shade').onclick=e=>{if(e.target.id==='shade')$('#shade').classList.remove('open')};$('#locBtn').onclick=()=>{if(!navigator.geolocation)return alert('Location is not supported.');navigator.geolocation.getCurrentPosition(p=>{$('#location').value=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`},()=>alert('Please allow location access.'))};$('#place').onclick=async()=>{if(!cart.length)return alert('Please add items first.');const customer={name:$('#name').value.trim(),phone:$('#phone').value.trim(),location:$('#location').value.trim()};const payment=document.querySelector('input[name=payment]:checked').value;if(!customer.name||!/^[0-9]{10}$/.test(customer.phone)||!customer.location)return alert('Please complete your name, 10-digit mobile number and location.');const btn=$('#place');btn.disabled=true;btn.textContent='PLACING ORDER…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,items:cart.map(i=>({name:i.name,qty:i.qty})),payment,note:$('#note').value.trim()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not place order');$('#successText').textContent=`Order #${data.orderId} · Total ₹${data.total}`;$('#track').href=`/track.html?id=${encodeURIComponent(data.orderId)}`;$('#checkout').style.display='none';$('#success').classList.add('show');cart=[];updateCart()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='PLACE ORDER'}};init();
</script></body></html>
